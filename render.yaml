services:
  - type: web
    name: campusops-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CAMPUSOPS_CORS_ORIGINS
        value: https://campusops-tau.vercel.app,https://campusops-shrashti-agarwals-projects.vercel.app
      - key: DATABASE_URL
        value: sqlite:////data/campusops.db
    disk:
      name: campusops-data
      mountPath: /data
      sizeGB: 1
